services:
  postgres:
    image: postgres:16-alpine
    container_name: sharedboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sharedboard
      POSTGRES_USER: sharedboard
      POSTGRES_PASSWORD: sharedboard_dev
    ports:
      - "5432:5432"
    volumes:
      - sharedboard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharedboard -d sharedboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sharedboard-postgres-data:
